name: Bolo
options:
  bundleIdPrefix: com.bolo
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.bolo.app
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Bolo
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: YES
    Release:
      ENABLE_HARDENED_RUNTIME: YES

targets:
  Bolo:
    type: application
    platform: macOS
    sources:
      - path: Bolo
        excludes:
          - "**/.DS_Store"
          - "**/Info.plist"
    settings:
      base:
        DEVELOPMENT_TEAM: KJ47YGNM8Z
        PRODUCT_BUNDLE_IDENTIFIER: com.bolo.app
        CODE_SIGN_ENTITLEMENTS: Bolo/Bolo.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Bolo/Info.plist
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          # Manual signing required for Developer ID (direct distribution + notarization)
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: Sashidhar Kokku (KJ47YGNM8Z)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    entitlements:
      path: Bolo/Bolo.entitlements
      properties:
        com.apple.security.device.audio-input: true
